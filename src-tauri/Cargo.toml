[package]
name = "gamevault"
version = "0.1.0"
description = "A local-first Windows desktop app for cataloging a personal video game collection."
authors = ["GameVault"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "gamevault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
thiserror = "2"

